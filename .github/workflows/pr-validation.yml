name: PR Validation

on:
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - revit-year: "2026"
            dotnet-version: "8.0.x"
          - revit-year: "2027"
            dotnet-version: "10.0.x"
    uses: ./.github/workflows/build.yml
    with:
      revit-year: ${{ matrix.revit-year }}
      dotnet-version: ${{ matrix.dotnet-version }}
    secrets: inherit
