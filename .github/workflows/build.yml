name: Build AppBundle

on:
  workflow_call:
    inputs:
      revit-year:
        description: 'Revit API year, e.g. 2026'
        required: true
        type: string
      dotnet-version:
        description: 'dotnet SDK version, e.g. 8.0.x'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore RevitMcpTools.csproj /p:RevitYear=${{ inputs.revit-year }}

      - name: Build
        run: dotnet build RevitMcpTools.csproj -c Release --no-restore /p:RevitYear=${{ inputs.revit-year }}

      - name: Publish
        run: dotnet publish RevitMcpTools.csproj -c Release -o ./publish /p:RevitYear=${{ inputs.revit-year }}

      - name: Assemble bundle
        shell: pwsh
        run: |
          $bundleDir = "artifact/RevitMcpTools.bundle"
          New-Item -ItemType Directory -Path "$bundleDir/Contents" -Force
          Copy-Item "RevitMcpTools.bundle/PackageContents.xml" "$bundleDir/"
          (Get-Content "$bundleDir/PackageContents.xml") -replace 'REVIT_YEAR', '${{ inputs.revit-year }}' | Set-Content "$bundleDir/PackageContents.xml"
          Copy-Item "RevitMcpTools.bundle/Contents/RevitMcpTools.addin" "$bundleDir/Contents/"
          Copy-Item "./publish/RevitMcpTools.dll" "$bundleDir/Contents/"
          Copy-Item "./publish/Newtonsoft.Json.dll" "$bundleDir/Contents/"

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path "artifact/RevitMcpTools.bundle" -DestinationPath "RevitMcpTools.bundle.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appbundle-${{ inputs.revit-year }}
          path: RevitMcpTools.bundle.zip
